<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamAegis - Online Student Exam Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- APP MOUNT CONTAINER -->
        <div id="student-app">
            <!-- Dynamic view injected via JavaScript -->
            <div class="login-card">
                <h2 style="margin-bottom:5px;">🛡️ ExamAegis Proctor</h2>
                <p style="text-align:center; color:#666; margin-bottom:20px; font-size:14px;">Online Student Verification & Proctor Room</p>
                
                <div id="login-error" style="color:red; margin-bottom:12px; display:none; text-align:center; font-weight:600;"></div>
                
                <form id="student-login-form">
                    <div class="form-group">
                        <label>FullName</label>
                        <input type="text" id="student-name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Roll Number (Unique ID)</label>
                        <input type="text" id="student-roll" class="form-control" placeholder="CS2026-0816" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="student-email" class="form-control" placeholder="john.doe@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label>Exam Identifier</label>
                        <input type="text" id="student-exam-id" class="form-control" placeholder="MATH101" required>
                    </div>
                    <button type="submit" class="btn">Enter Exam Hall & Verify Cam</button>
                </form>
                
                <div class="text-center" style="margin-top: 15px;">
                    <a href="admin_dashboard.html" style="font-size: 13px; color: #1e3d59; font-weight: 600;">Go to Instructor Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for capturing video frames -->
    <canvas id="webcam-canvas"></canvas>

    <!-- Project JS dependencies -->
    <script src="js/webcam.js"></script>
    <script src="js/socket_client.js"></script>
    <script>
        document.getElementById("student-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("student-name").value;
            const roll_number = document.getElementById("student-roll").value;
            const email = document.getElementById("student-email").value;
            const exam_id = document.getElementById("student-exam-id").value;
            const errorDiv = document.getElementById("login-error");

            try {
                // 1. Authenticate / Register Student
                const authResponse = await fetch("/api/auth/student-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, roll_number, email, exam_id })
                });

                if (!authResponse.ok) {
                    const errorData = await authResponse.json();
                    errorDiv.innerText = errorData.detail || "Authentication failed.";
                    errorDiv.style.display = "block";
                    return;
                }

                const authData = await authResponse.json();
                const token = authData.access_token;

                // 2. Start Exam Session on backend
                const examResponse = await fetch("/api/exam/start", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ exam_id })
                });

                if (!examResponse.ok) {
                    errorDiv.innerText = "Failed to initiate exam session.";
                    errorDiv.style.display = "block";
                    return;
                }

                const examData = await examResponse.json();
                const sessionId = examData.id;

                // 3. Render Student Exam Room UI
                renderExamRoom(name, exam_id, sessionId, token);

            } catch (err) {
                console.error("Login process failed:", err);
                errorDiv.innerText = "Error connecting to server. Is FastAPI running?";
                errorDiv.style.display = "block";
            }
        });

        async function renderExamRoom(name, examId, sessionId, token) {
            document.getElementById("student-app").innerHTML = `
                <!-- Warning Alert Banner -->
                <div id="violation-alert" class="alert-banner">
                    ⚠️ WARNING: Please face the camera and follow all proctor rules!
                </div>
                
                <div class="flex-space">
                    <div>
                        <h2>Exam In Progress: ${examId}</h2>
                        <p>Student: <strong>${name}</strong></p>
                    </div>
                    <div>
                        <span id="socket-status" class="status-badge status-disconnected">CONNECTING PROCTOR...</span>
                    </div>
                </div>

                <div class="exam-layout">
                    <!-- Left: Questions Panel -->
                    <div class="exam-panel">
                        <h3>General Instructions</h3>
                        <p style="margin-top: 10px; color:#555;">
                            This exam is fully monitored in real time using the <strong>ExamAegis AI Proctor</strong>. 
                            Your webcam feed and background audio are continuously processed on our secure servers.
                        </p>
                        
                        <div style="background:#f8f9fa; padding:15px; border-radius:4px; margin-top:20px; border-left:3px solid #17b978;">
                            <h4>⚠️ Rules of Conduct:</h4>
                            <ul style="margin-left: 20px; margin-top:10px; font-size:14px; color:#444;">
                                <li>Ensure you are in a quiet, well-lit room.</li>
                                <li>Keep your face centered and visible at all times.</li>
                                <li>Do not look away from the screen for prolonged periods.</li>
                                <li>Do not speak or allow background talking.</li>
                                <li>Do not use cell phones, textbooks, or other materials.</li>
                                <li>Only 1 person is allowed in front of the camera.</li>
                            </ul>
                        </div>

                        <!-- Mock Question block -->
                        <div style="margin-top: 25px;">
                            <h4>Question 1 of 1</h4>
                            <p style="margin-top:10px; font-weight:600;">Describe the main benefit of real-time AI-based proctoring frameworks:</p>
                            <textarea class="form-control" rows="5" style="margin-top:10px; resize:none;" placeholder="Write your response here..."></textarea>
                        </div>
                        
                        <button id="end-exam-btn" class="btn btn-secondary mt-20" style="background:#ff4d6d;">End Exam & Submit Session</button>
                    </div>

                    <!-- Right: Proctor / Video Feed -->
                    <div class="proctor-panel">
                        <div class="webcam-container">
                            <video id="webcam-video" autoplay muted playsinline></video>
                        </div>
                        
                        <div class="exam-panel">
                            <h4>Real-Time AI Metrics</h4>
                            <div id="metrics-container" style="font-size: 13px; color:#555; margin-top: 10px; line-height: 1.8;">
                                Initializing AI analyzers...
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Initialize Webcam
            const webcam = new WebcamManager("webcam-video", "webcam-canvas");
            try {
                await webcam.initialize();
            } catch (err) {
                alert(err.message);
                window.location.reload();
                return;
            }

            // Initialize WebSocket Proctoring Client
            const client = new ProctorSocketClient(
                sessionId, 
                token, 
                webcam, 
                "violation-alert", 
                "socket-status", 
                "metrics-container"
            );
            client.connect();

            // Handle "End Exam" Click
            document.getElementById("end-exam-btn").addEventListener("click", async () => {
                const conf = confirm("Are you sure you want to end the exam and submit?");
                if (!conf) return;

                // Stop tracking streams
                client.disconnect();
                webcam.stop();

                try {
                    // Call backend to mark exam session as complete
                    const response = await fetch(`/api/exam/end/${sessionId}`, {
                        method: "POST",
                        headers: { 
                            "Authorization": `Bearer ${token}` 
                        }
                    });

                    if (response.ok) {
                        alert("Exam session submitted successfully. You may close this tab.");
                        window.location.reload();
                    } else {
                        alert("Error closing session on server.");
                    }
                } catch (err) {
                    console.error("End exam request failed:", err);
                    alert("Network error ending exam.");
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
